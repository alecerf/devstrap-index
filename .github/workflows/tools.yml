name: Update tool listing

on:
  push:
    branches: [trunk]
    paths:
      - "tools/*.json"

permissions:
  contents: write

jobs:
  update-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Generate tools.json
        run: |
          find tools -name '*.json' -maxdepth 1 \
            | sort \
            | jq -R . \
            | jq -s . > tools.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tools.json
          git diff --cached --quiet || git commit -m "chore: update tool listing" && git push
