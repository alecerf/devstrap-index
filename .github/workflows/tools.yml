name: Update tool listing

on:
  push:
    branches: [trunk]
    paths:
      - "tools/*.json"

permissions:
  contents: write

jobs:
  update-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Format tool definitions
        run: |
          for f in tools/*.json; do
            jq --indent 2 . "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          done

      - name: Generate tools.json
        run: |
          find tools -maxdepth 1 -name '*.json' \
            | sort \
            | jq -R . \
            | jq -s . > tools.json

      - name: Generate TOOLS.md
        run: |
          cat tools/*.json | jq -s '
            "# Available tools\n\n> Auto-generated from tool definitions. Do not edit.\n\n| Tool | Description | Source | Install | Platforms |\n|------|-------------|--------|---------|-----------|\n" +
            (sort_by(.name) | map(
              "| **" + .name + "** | " + .description + " | `" + .source.type + "` | `" + .install.mode + "` | " + (.platforms.os | join(", ")) + " |"
            ) | join("\n")) +
            "\n\n## Details\n\n" +
            (sort_by(.name) | map(
              "### " + .name + "\n\n" +
              .description + "\n\n" +
              "- **Source:** `" + .source.type + "`" +
              (if .source.type == "github_release" then " ([" + .source.owner + "/" + .source.repo + "](https://github.com/" + .source.owner + "/" + .source.repo + "))" else "" end) + "\n" +
              "- **Install mode:** `" + .install.mode + "` → `" + .install.dest + "/`\n" +
              "- **Platforms:** " + (.platforms.os | join(", ")) + " (" + (.platforms.arch | keys | join(", ")) + ")\n" +
              "- **Detect:** `" + .detect.binary + " " + (.detect.args | join(" ")) + "`\n"
            ) | join("\n"))
          ' -r > TOOLS.md

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tools.json TOOLS.md tools/*.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update tool listing"
            git push
          fi
